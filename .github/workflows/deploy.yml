name: deploy

on:
  workflow_dispatch:

jobs:

  pypi:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9.16
      - name: Pin build backend to the released generator
        run: |
          echo "hatchling==1.14.0" > /tmp/seal-constraints.txt
          mkdir -p /tmp/seal-site
          echo "import importlib.util  # noqa: F401" > /tmp/seal-site/sitecustomize.py
          echo "PIP_CONSTRAINT=/tmp/seal-constraints.txt" >> $GITHUB_ENV
          echo "PYTHONPATH=/tmp/seal-site" >> $GITHUB_ENV
      - name: Package
        run: |
          pip install --index-url 'https://:2023-04-16@time-machines-pypi.sealsecurity.io/' --upgrade build
          python -m build -s -w
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
